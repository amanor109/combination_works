<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="number guessing.css">

</head>
<body>
    <div id="playarea">
        <div>
            <h1>
                Guess a number from 1 to 5
            </h1>
        </div>

        <div id='input_submit_area'>
            <input id="user_input" type="text" placeholder= "eg. 3">
            <button id="submit_btn">Submit</button>
        </div>

        <div>
            <p id="scores">Your scores will be displayed here!</p>
            <p id="percentage">Game stat 2</p>
        </div>


        <div>
            <p id="thank_you">Thanks for playing this game</p>
            <p id="you_are">You are ........... </p>
            <p id="the_number">The number is .....</p>
            <p id="prev">Your previous guess was.....</p>

        </div>
        
    </div>
    




    <button id="home-btn">Home</button>
    <script src="number guessing.js"></script>
</body>
</html>
