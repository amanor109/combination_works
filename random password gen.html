<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Password Generator</title>
    <link rel="stylesheet" href="random password gen.css">
</head>
<body>

    <label for="password_lenght">Password Length:</label>
    <input type="number" id="password_lenght" value = "8" min = 6 >
    <br>
    <br>

    <label for="uppercase">Include Uppercase Letters</label>
    <input type="checkbox" id="uppercase">
    <br>
    <br>

    <label for="lowercase">Include Lowercase Letters</label>
    <input type="checkbox" id="lowercase">
    <br>
    <br>

    <label for="numbers">Include Numbers</label>
    <input type="checkbox" id="numbers">
    <br>
    <br>

    <label for="symbols">Include Symbols</label>
    <input type="checkbox" id="symbols">
    <br>
    <br>


    <button id="generate">Generate Password</button>

    <h1 id="password-result"></h1>
    <script src="random password gen.js"></script>
</body>
</html>
