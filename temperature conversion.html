<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next Project</title>
    <link rel="stylesheet" href="temperature conversion.css">
</head>
<body>
    <div class="working_area">
        <h2 class="temp_top">
            Temperature Conversion ☁ :
        </h2>
        <input id="user_input" type="number" placeholder="Enter the temperature">
        <div id="bottons">
            <div>
                <input id="cel_fah" type="radio" name="convert" >
                <label for="cel_fah">Celsius ➡ Fahrenheit</label>
            </div>
            
            <br>
            <div>
                <input type="radio" id="fah_cel" name="convert">
                <label for="fah_cel">Fahrenheit ➡ Celsius</label><br><br>
            </div>
            
            <button id="convert_btn">
                Convert
            </button>


            <h2 id="result">
                Hello!! Welcome to the conversion 
            </h2>

        </div>
        
    </div>




    <button id="home_btn">
        Home
    </button>




    <script src="temperature conversion.js"></script>
</body>
</html>
